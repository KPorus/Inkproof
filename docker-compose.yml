services:
  postgres:
    image: postgres:16-alpine
    container_name: inkproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkproof
      POSTGRES_PASSWORD: inkproof
      POSTGRES_DB: inkproof
    ports:
      - "5435:5432"
    volumes:
      - inkproof_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkproof -d inkproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inkproof_pg_data:
